services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sig_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: sig_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sig.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgis

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.1
    container_name: sig_geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8081:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on:
      - postgis

volumes:
  pgdata:
  geoserver_data:
